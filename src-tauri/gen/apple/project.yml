name: pgstudio
options:
  bundleIdPrefix: com.pgstudio.helixdb
  deploymentTarget:
    iOS: 14.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: pgStudio
      PRODUCT_BUNDLE_IDENTIFIER: com.pgstudio.helixdb
      DEVELOPMENT_TEAM: GZM73634C6
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  pgstudio_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: pgstudio_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: pgstudio_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 1.4.6
        CFBundleVersion: "1.4.6"
        # iOS 14+ local network + HTTP to LAN/USB dev host (Tauri dev proxy uses native HTTP client).
        NSLocalNetworkUsageDescription: "pgStudio needs access to devices on your local network for PostgreSQL and other LAN hosts, and while developing from Xcode to load the web UI from your Mac. Tap Allow when prompted; change anytime in Settings > Privacy & Security > Local Network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Bonjour browse warmup (NWBrowser); pair with multicast entitlement on the App ID.
        NSBonjourServices:
          - _http._tcp
    entitlements:
      path: pgstudio_iOS/pgstudio_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        # Tauri `ios xcode-script` may refresh entitlements during the build; Xcode 15+ rejects that
        # unless this is set (see ProcessProductPackaging error).
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
        # Allow cargo/rustc to write outside the sandbox (registry, incremental, etc.).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # libgit2 (Rust git2): inflate* → zlib; iconv_* → libiconv
        OTHER_LDFLAGS:
          - $(inherited)
          - -lz
          - -liconv
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      configs:
        debug:
          ONLY_ACTIVE_ARCH: YES
        release:
          ONLY_ACTIVE_ARCH: NO
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: Network.framework
    preBuildScripts:
      # Logic lives in src-tauri/apple-scripts/tauri-ios-xcode.sh (arch + PATH + sandbox-safe cargo).
      - script: 'exec sh "${SRCROOT}/../../apple-scripts/tauri-ios-xcode.sh"'
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a