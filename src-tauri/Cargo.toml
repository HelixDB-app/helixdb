[package]
name = "pgstudio"
version = "1.4.5"
description = "pgStudio — High-Performance PostgreSQL Admin Panel"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.21"
regex = "1.11"
log = "0.4"
tauri = { version = "2.10.0", features = ["devtools", "protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (for fetching user profile from web API)
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }

# PostgreSQL
tokio-postgres = { version = "0.7", features = ["array-impls", "with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
deadpool = "0.12"
deadpool-postgres = { version = "0.14" }
postgres-native-tls = "0.5"
rust_decimal = { version = "1.36", features = ["db-tokio-postgres"] }
native-tls = "0.2"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
flate2 = "1.0"
dashmap = "6"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Git operations
git2 = { version = "0.19", default-features = false, features = ["https", "vendored-openssl"] }

# Runtime .env loading
dotenvy = "0.15"

# Cryptography (device fingerprint)
sha2 = "0.10"
hex = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSApplication",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
] }
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"
dispatch = "0.2"
resvg = { version = "0.47", default-features = false }
usvg = { version = "0.47", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Security_Credentials_UI",
] }
windows-future = "0.3"

# Patched: objc2-system-configuration + SCDynamicStore are macOS-only (see third-party/whoami).
[patch.crates-io]
whoami = { path = "third-party/whoami" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
